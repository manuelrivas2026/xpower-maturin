<style>
:root{
  --navy:#0F1A2B; --panel:#16243A; --cyan:#0BB8DE; --ice:#E6F3F7; --mute:#9FB3C4; --deep:#0A1322;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --navy:#0F1A2B; --panel:#16243A; --cyan:#0BB8DE; --ice:#E6F3F7; --mute:#9FB3C4; --deep:#0A1322; } }
:root[data-theme="dark"]{ --navy:#0F1A2B; --panel:#16243A; --cyan:#0BB8DE; --ice:#E6F3F7; --mute:#9FB3C4; --deep:#0A1322; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--ice);font-family:Saira,"Arial Narrow",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:6px}
.wrap{position:relative;min-height:100%;max-width:560px;margin:0 auto;padding:48px 28px 40px;display:flex;flex-direction:column;justify-content:center;isolation:isolate}
.slash{position:absolute;z-index:-1;top:-10%;right:-18%;width:46%;height:120%;background:var(--cyan);transform:skewX(-38deg);opacity:.14}
.mark{width:min(220px,58%);height:auto;display:block}
.word{width:min(240px,64%);height:auto;display:block;margin-top:22px}
.bar{margin-top:40px;height:10px;border-radius:5px;background:var(--panel);overflow:hidden}
.bar span{display:block;height:100%;width:68%;background:var(--cyan);border-radius:5px;transform-origin:left}
@media (prefers-reduced-motion: no-preference){
  .bar span{animation:charge 1.6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes charge{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}
h1{margin:28px 0 0;font-weight:800;font-style:italic;font-variation-settings:"wdth" 125;font-size:clamp(32px,9vw,48px);line-height:1.02;text-wrap:balance}
p{margin:14px 0 0;color:var(--mute);font-size:18px;max-width:38ch}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.links a{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:10px 20px;border-radius:14px;font-weight:700;font-size:17px;text-decoration:none;background:var(--panel);color:var(--ice)}
.links a.primary{background:var(--cyan);color:var(--deep)}
.links a:hover{filter:brightness(1.1)}
.links svg{width:22px;height:22px;flex:none}
</style>
</head>
